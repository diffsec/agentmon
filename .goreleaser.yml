version: 2
project_name: agentmon

before:
  hooks:
    - go mod download
    - ./scripts/build-envshim.sh
    - ./scripts/build-ptracer.sh

builds:
  # Linux amd64: CGO enabled for full seccomp user-notify support.
  # Links dynamically against system libseccomp (>=2.5). The kernel
  # flag SECCOMP_FILTER_FLAG_WAIT_KILLABLE_RECV is set via the raw
  # seccomp(2) syscall path; see internal/platform/linux/seccomp/.
  - id: agentmon-linux-amd64
    main: ./cmd/agentmon
    binary: agentmon
    env:
      - CGO_ENABLED=1
    goos:
      - linux
    goarch:
      - amd64
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.ShortCommit}}

  # Linux arm64: CGO enabled (cross-compiled). Links dynamically
  # against arm64 libseccomp from Ubuntu multiarch
  # (libseccomp-dev:arm64). PKG_CONFIG_LIBDIR points at the arm64
  # pkgconfig path so the amd64 host's pkg-config doesn't pick up
  # x86_64 libseccomp.
  - id: agentmon-linux-arm64
    main: ./cmd/agentmon
    binary: agentmon
    env:
      - CGO_ENABLED=1
      - CC=aarch64-linux-gnu-gcc
      - PKG_CONFIG_LIBDIR=/usr/lib/aarch64-linux-gnu/pkgconfig:/usr/share/pkgconfig
    goos:
      - linux
    goarch:
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.ShortCommit}}

  - id: agentmon-darwin
    main: ./cmd/agentmon
    binary: agentmon
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.ShortCommit}}

  - id: shim-linux
    main: ./cmd/agentmon-shell-shim
    binary: agentmon-shell-shim
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w

  - id: shim-darwin
    main: ./cmd/agentmon-shell-shim
    binary: agentmon-shell-shim
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w

  # unixwrap: seccomp wrapper for Linux amd64. CGO enabled; links
  # dynamically against system libseccomp (>=2.5).
  - id: unixwrap-linux-amd64
    main: ./cmd/agentmon-unixwrap
    binary: agentmon-unixwrap
    env:
      - CGO_ENABLED=1
    goos:
      - linux
    goarch:
      - amd64
    ldflags:
      - -s -w

  # unixwrap: seccomp wrapper for Linux arm64 (cross-compiled). Links
  # dynamically against arm64 libseccomp from Ubuntu multiarch
  # (libseccomp-dev:arm64). PKG_CONFIG_LIBDIR set to the arm64
  # multiarch pkgconfig path (fail-closed: replaces default search
  # path so the amd64 host pkg-config can't pick up x86_64 .pc files).
  - id: unixwrap-linux-arm64
    main: ./cmd/agentmon-unixwrap
    binary: agentmon-unixwrap
    env:
      - CGO_ENABLED=1
      - CC=aarch64-linux-gnu-gcc
      - PKG_CONFIG_LIBDIR=/usr/lib/aarch64-linux-gnu/pkgconfig:/usr/share/pkgconfig
    goos:
      - linux
    goarch:
      - arm64
    ldflags:
      - -s -w

  # stub: exec redirect proxy for FUSE/seccomp interception
  - id: stub-linux
    main: ./cmd/agentmon-stub
    binary: agentmon-stub
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w

  - id: stub-darwin
    main: ./cmd/agentmon-stub
    binary: agentmon-stub
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w

  # agentmon-macwrap is deliberately NOT built here.
  #
  # It calls sandbox_init_with_parameters through cgo, and GoReleaser
  # cross-compiles darwin from a Linux runner with CGO_ENABLED=0. Building it
  # here would produce main_nocgo.go -- a stub that exits non-zero on every
  # invocation -- which archives, lipos and signs cleanly and then silently
  # disables seatbelt enforcement for every exec.
  #
  # It is built with cgo on the macOS runner in .github/workflows/release.yml
  # ("Rebuild CGO binaries on macOS") and ships in AgentMon.app only. Locally:
  #   make build-macwrap

archives:
  - id: agentmon-linux
    ids:
      - agentmon-linux-amd64
      - agentmon-linux-arm64
      - shim-linux
      - unixwrap-linux-amd64
      - unixwrap-linux-arm64
      - stub-linux
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_linux_{{ .Arch }}"
    files:
      - README.md
      - LICENSE
      - config.yml
      - default-policy.yml
      - src: configs/policies/*.yaml
        dst: configs/policies
        strip_parent: true
      - src: build/envshim/linux_{{ .Arch }}/*
        dst: .
        strip_parent: true
      - src: build/ptracer/linux_{{ .Arch }}/*
        dst: .
        strip_parent: true
      - packaging/bash_startup.sh
    builds_info:
      mode: 0755
      group: root
      owner: root

  - id: agentmon-darwin
    ids:
      - agentmon-darwin
      - shim-darwin
      - stub-darwin
      # agentmon-macwrap is absent from this archive by design; see the build
      # section above. It is delivered through AgentMon.app / the Homebrew cask.
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_darwin_{{ .Arch }}"
    files:
      - README.md
      - LICENSE
      - config.yml
      - default-policy.yml
      - src: configs/policies/*.yaml
        dst: configs/policies
        strip_parent: true

checksum:
  name_template: "checksums.txt"

nfpms:
  - id: agentmon
    package_name: agentmon
    ids:
      - agentmon-linux-amd64
      - agentmon-linux-arm64
      - shim-linux
      - unixwrap-linux-amd64
      - unixwrap-linux-arm64
      - stub-linux
    formats:
      - deb
      - rpm
      - archlinux
    bindir: /usr/bin
    vendor: AgentMon
    homepage: https://github.com/diffsec/agentmon
    maintainer: AgentMon Team <team@agentmon.dev>
    description: |
      Secure sandboxed shell for AI agents.
      Provides policy-based access control for file, network, and command operations.
    license: MIT
    section: utils
    priority: optional
    contents:
      # Configuration
      - src: packaging/config.yaml
        dst: /etc/agentmon/config.yaml
        type: config|noreplace
        file_info:
          mode: 0644
      # Shell completions
      - src: packaging/completions/agentmon.bash
        dst: /usr/share/bash-completion/completions/agentmon
        file_info:
          mode: 0644
      - src: packaging/completions/agentmon.zsh
        dst: /usr/share/zsh/site-functions/_agentmon
        file_info:
          mode: 0644
      - src: packaging/completions/agentmon.fish
        dst: /usr/share/fish/vendor_completions.d/agentmon.fish
        file_info:
          mode: 0644
      # Documentation
      - src: README.md
        dst: /usr/share/doc/agentmon/README.md
        file_info:
          mode: 0644
      - src: LICENSE
        dst: /usr/share/doc/agentmon/LICENSE
        file_info:
          mode: 0644
      # Envshim library (Linux only) - uses glob to skip if not built
      - src: build/envshim/linux_{{ .Arch }}/*.so
        dst: /usr/lib/agentmon/
      # Ptracer LD_PRELOAD library (Linux only) - Yama ptrace_scope workaround
      - src: build/ptracer/linux_{{ .Arch }}/*.so
        dst: /usr/lib/agentmon/
      # Bash startup script for environment injection
      - src: packaging/bash_startup.sh
        dst: /usr/lib/agentmon/bash_startup.sh
        file_info:
          mode: 0755
      # Policy files
      - src: configs/policies/*.yaml
        dst: /etc/agentmon/policies/
        type: config|noreplace
        file_info:
          mode: 0644
      # Create directories
      - dst: /etc/agentmon
        type: dir
        file_info:
          mode: 0755
      - dst: /etc/agentmon/policies
        type: dir
        file_info:
          mode: 0755
      - dst: /usr/lib/agentmon
        type: dir
        file_info:
          mode: 0755
    rpm:
      group: Applications/System
    archlinux:
      pkgbase: agentmon

release:
  draft: false
  prerelease: auto

# Homebrew cask is published by the publish-homebrew-cask job in release.yml
# (not managed by GoReleaser — the cask installs the signed DMG, not raw binaries)
